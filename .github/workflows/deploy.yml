name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A typecheck or locale regression blocks the deploy rather than shipping.
      #
      # The grep is not belt-and-braces. Until @astrojs/check and typescript
      # were added as devDependencies, this step printed "packages cannot be
      # installed automatically in CI environments" and EXITED 0 — so every
      # deploy reported a green typecheck while performing none. astro check
      # only prints "Result (N files)" when it actually ran, so asserting on
      # that line is what makes the step honest.
      - name: Typecheck
        run: |
          set -o pipefail
          npx astro check --minimumSeverity error 2>&1 | tee /tmp/astro-check.log
          grep -q 'Result (' /tmp/astro-check.log || {
            echo "::error::astro check did not run — see log above"
            exit 1
          }

      # facts.pending.ts is gitignored, so CI runs with zero pending facts
      # while a local checkout has eleven. The suite is verified to pass in
      # both states.
      - name: Test
        run: npm test

      - name: Build
        env:
          SITE_URL: https://minmeychang.com
          # Opened to search engines 2026-08-05 at the owner's direction.
          # Set to 'false' to pull the site back out of the index.
          ALLOW_INDEXING: 'true'
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
