<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Archive editor — minmeychang</title>
<meta name="robots" content="noindex" />
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --rule: #ddd8d0;
    --text: #262420;
    --text-soft: #6b665e;
    --brand: #8a2f2f;
    --accent: #f2e9df;
    --danger: #a4302f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--brand);
    color: white;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .status { font-size: 13px; opacity: 0.85; }
  header .spacer { flex: 1; }
  button {
    font: inherit;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    cursor: pointer;
  }
  .btn-primary { background: white; color: var(--brand); font-weight: 600; }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }
  .btn-ghost { background: transparent; color: white; border: 1px solid rgba(255,255,255,0.5); }
  main { max-width: 980px; margin: 0 auto; padding: 24px 20px 80px; }
  nav.jump { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; font-size: 14px; }
  nav.jump a { color: var(--brand); text-decoration: underline; }
  section.category { margin-top: 34px; }
  section.category > h2 { font-size: 20px; color: var(--brand); margin: 0 0 4px; }
  .decade-group { margin-top: 18px; }
  .decade-group > h3 { font-size: 14px; color: var(--text-soft); text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 8px; }
  .item {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
    display: grid;
    grid-template-columns: 96px 1fr;
    gap: 14px;
  }
  .item.dirty { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
  .item.deleted { opacity: 0.4; }
  .thumb {
    width: 96px;
    height: 96px;
    object-fit: cover;
    border-radius: 6px;
    background: var(--accent);
  }
  .thumb-placeholder {
    width: 96px;
    height: 96px;
    border-radius: 6px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--text-soft);
    text-align: center;
    padding: 4px;
  }
  .fields { display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row label { font-size: 11px; color: var(--text-soft); text-transform: uppercase; letter-spacing: 0.03em; margin-right: 2px; }
  input[type=text], textarea, select {
    font: inherit;
    border: 1px solid var(--rule);
    border-radius: 5px;
    padding: 5px 8px;
    background: #fffdfa;
    color: var(--text);
  }
  input[type=text].label-en { width: 240px; }
  input[type=text].label-zh { width: 200px; }
  textarea { width: 100%; resize: vertical; min-height: 40px; }
  select.decade { width: 90px; }
  select.category { width: 170px; }
  .meta { font-size: 11px; color: var(--text-soft); }
  .actions { display: flex; gap: 6px; margin-left: auto; }
  .actions button { padding: 4px 8px; font-size: 12px; }
  .btn-move { background: var(--accent); color: var(--text); }
  .btn-delete { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn-delete.confirm { background: var(--danger); color: white; }
  .caption-fields { margin-top: 4px; }
  .id-badge { font-family: ui-monospace, monospace; font-size: 11px; color: var(--text-soft); }
</style>
</head>
<body>
  <header>
    <h1>Archive editor</h1>
    <span class="status" id="status">loading…</span>
    <div class="spacer"></div>
    <button class="btn-ghost" id="reload-btn">Discard changes</button>
    <button class="btn-primary" id="save-btn" disabled>Save all changes</button>
  </header>
  <main>
    <p class="meta">
      Edits write straight to <code>src/data/archive.ts</code> on disk. Nothing is
      committed or pushed — check <code>git diff</code> and go through your usual
      branch → PR flow when you're happy with it. To add a brand-new photo, use
      <code>npm run photos</code> first (this tool only edits existing entries).
    </p>
    <nav class="jump" id="jump-nav"></nav>
    <div id="sections"></div>
  </main>
  <script src="/admin.js"></script>
</body>
</html>
