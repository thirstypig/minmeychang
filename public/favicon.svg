<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="張馬敏妹">
  <!-- Her complete name, not a single surname character. 張 alone named her
       husband's family; 張馬敏妹 is the 冠夫姓 form that carries her own maiden
       surname 馬 inside it, which is the whole point of the name.

       Set 2x2 rather than in a line so all four characters stay legible at
       favicon sizes. Red ground, reserved characters — the 朱文 seal form. -->
  <rect width="64" height="64" rx="7" fill="#b02a1f" />
  <g
    fill="#fdf6f2"
    font-family="'Songti TC','Noto Serif TC','PingFang TC',serif"
    font-size="27"
    text-anchor="middle">
    <text x="18" y="20" dominant-baseline="central">張</text>
    <text x="46" y="20" dominant-baseline="central">馬</text>
    <text x="18" y="46" dominant-baseline="central">敏</text>
    <text x="46" y="46" dominant-baseline="central">妹</text>
  </g>
</svg>
