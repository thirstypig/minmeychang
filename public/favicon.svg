<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="張馬敏妹">
  <!-- A 印泥 seal: the cinnabar chop stamped on Chinese calligraphy, carrying
       her surname. The same source as the site's brand colour. Traditional
       seals are red ground with reserved (white) characters — 朱文. -->
  <rect width="64" height="64" rx="7" fill="#b02a1f" />
  <text
    x="32"
    y="33"
    fill="#fdf6f2"
    font-family="'Songti TC','Noto Serif TC','PingFang TC',serif"
    font-size="42"
    text-anchor="middle"
    dominant-baseline="central">張</text>
</svg>
